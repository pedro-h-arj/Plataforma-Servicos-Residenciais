
{% extends "base.html" %}

{% block titulo %}Editar serviço | Serviços Residenciais{% endblock %}

{% block conteudo %}

<div class="form-page-container">

    <div class="page-heading mb-4">
        <div>
            <span class="page-eyebrow">ÁREA DO PRESTADOR</span>
            <h1>Editar serviço</h1>
            <p class="text-muted mb-0">
                Atualize as informações do serviço cadastrado.
            </p>
        </div>

        <div class="page-heading-icon">
            <i class="bi bi-pencil-square"></i>
        </div>
    </div>

    <div class="auth-card">

        <form method="POST">

            <div class="mb-3">
                <label for="nome" class="form-label">Nome do serviço *</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    class="form-control"
                    value="{{ servico.nome }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="categoria" class="form-label">Categoria *</label>
                <input
                    type="text"
                    id="categoria"
                    name="categoria"
                    class="form-control"
                    value="{{ servico.categoria }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição *</label>
                <textarea
                    id="descricao"
                    name="descricao"
                    class="form-control"
                    rows="5"
                    required
                >{{ servico.descricao }}</textarea>
            </div>

            <div class="mb-4">
                <label for="valor_estimado" class="form-label">
                    Valor estimado (R$)
                </label>

                <div class="input-group auth-input-group">
                    <span class="input-group-text">R$</span>
                    <input
                        type="number"
                        id="valor_estimado"
                        name="valor_estimado"
                        class="form-control"
                        step="0.01"
                        min="0"
                        value="{{ servico.valor_estimado if servico.valor_estimado is not none else '' }}"
                    >
                </div>

                <div class="form-text">
                    Deixe em branco se o valor ainda precisar ser combinado.
                </div>
            </div>

            <div class="form-actions">
                <a
                    href="{{ url_for('meus_servicos') }}"
                    class="btn btn-outline-secondary"
                >
                    <i class="bi bi-x-lg me-1"></i>
                    Cancelar
                </a>

                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg me-1"></i>
                    Salvar alterações
                </button>
            </div>

        </form>

    </div>
</div>

{% endblock %}
