{% extends "base.html" %}

{% block titulo %}Editar Serviço{% endblock %}

{% block conteudo %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h2 class="mb-4">Editar serviço</h2>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Nome do serviço</label>

                        <input
                            type="text"
                            name="nome"
                            class="form-control"
                            value="{{ servico.nome }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Categoria</label>

                        <input
                            type="text"
                            name="categoria"
                            class="form-control"
                            value="{{ servico.categoria }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descrição</label>

                        <textarea
                            name="descricao"
                            class="form-control"
                            rows="5"
                            required
                        >{{ servico.descricao }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            Valor estimado
                        </label>

                        <input
                            type="number"
                            name="valor_estimado"
                            class="form-control"
                            step="0.01"
                            min="0"
                            value="{{ servico.valor_estimado if servico.valor_estimado is not none else '' }}"
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Salvar alterações
                    </button>

                    <a
                        href="{{ url_for('meus_servicos') }}"
                        class="btn btn-outline-secondary ms-2"
                    >
                        Cancelar
                    </a>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
