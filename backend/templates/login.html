
{% extends "base.html" %}

{% block titulo %}Entrar | Serviços Residenciais{% endblock %}

{% block conteudo %}

<div class="auth-container">
    <div class="auth-card">

        <div class="auth-icon">
            <i class="bi bi-house-check-fill"></i>
        </div>

        <div class="text-center mb-4">
            <h1 class="auth-title">Bem-vindo(a)!</h1>
            <p class="auth-subtitle">
                Entre na sua conta para continuar.
            </p>
        </div>

        <form method="POST">

            <div class="mb-3">
                <label for="email" class="form-label">
                    E-mail
                </label>

                <div class="input-group auth-input-group">
                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >
                </div>
            </div>

            <div class="mb-4">
                <label for="senha" class="form-label">
                    Senha
                </label>

                <div class="input-group auth-input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        class="form-control"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 auth-submit">
                Entrar na plataforma
                <i class="bi bi-arrow-right ms-2"></i>
            </button>

        </form>

        <div class="auth-divider"></div>

        <p class="text-center mb-0 auth-register">
            Ainda não tem uma conta?
            <a href="{{ url_for('cadastro') }}">Cadastre-se</a>
        </p>

    </div>

    <p class="auth-footer text-center">
        Encontre serviços residenciais com praticidade.
    </p>
</div>

{% endblock %}
