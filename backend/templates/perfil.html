{% extends "base.html" %}

{% block titulo %}Meu Perfil{% endblock %}

{% block conteudo %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h2 class="mb-4">Meu perfil</h2>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Nome</label>

                        <input
                            type="text"
                            name="nome"
                            class="form-control"
                            value="{{ current_user.nome }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">E-mail</label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ current_user.email }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Telefone</label>

                        <input
                            type="text"
                            name="telefone"
                            class="form-control"
                            value="{{ telefone }}"
                        >
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Perfil</label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ current_user.perfil }}"
                            disabled
                        >

                        <div class="form-text">
                            O perfil de acesso não pode ser alterado pelo usuário.
                        </div>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Salvar alterações
                    </button>

                    <a
                        href="{{ url_for('painel') }}"
                        class="btn btn-outline-secondary ms-2"
                    >
                        Voltar
                    </a>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
