{% extends "base.html" %}

{% block titulo %}Cadastrar Serviço{% endblock %}

{% block conteudo %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h2 class="mb-4">Cadastrar serviço</h2>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">Nome do serviço</label>
                        <input
                            type="text"
                            name="nome"
                            class="form-control"
                            placeholder="Ex.: Instalação elétrica"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Categoria</label>
                        <input
                            type="text"
                            name="categoria"
                            class="form-control"
                            placeholder="Ex.: Elétrica"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descrição</label>
                        <textarea
                            name="descricao"
                            class="form-control"
                            rows="5"
                            placeholder="Descreva o serviço oferecido"
                            required
                        ></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            Valor estimado
                        </label>

                        <input
                            type="number"
                            name="valor_estimado"
                            class="form-control"
                            step="0.01"
                            min="0"
                            placeholder="Ex.: 150.00"
                        >

                        <div class="form-text">
                            Campo opcional. O prestador poderá informar o
                            valor após avaliar o serviço.
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Cadastrar serviço
                    </button>

                    <a
                        href="{{ url_for('painel') }}"
                        class="btn btn-outline-secondary ms-2"
                    >
                        Voltar
                    </a>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
