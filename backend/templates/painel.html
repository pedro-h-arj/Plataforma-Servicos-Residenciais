{% extends "base.html" %}

{% block titulo %}Painel do Usuário{% endblock %}

{% block conteudo %}

<div class="container">
    <div class="card shadow-sm">
        <div class="card-body p-4">

            <h2>Bem-vindo, {{ current_user.nome }}!</h2>

            <p class="mt-3">
                Você está autenticado na Plataforma de Serviços Residenciais.
            </p>

            <p>
                Seu perfil é:
                <strong>{{ current_user.perfil }}</strong>
            </p>

            <form method="POST" action="{{ url_for('logout') }}">
                <button type="submit" class="btn btn-outline-danger">
                    Sair da conta
                </button>
            </form>

        </div>
    </div>
</div>

{% endblock %}
